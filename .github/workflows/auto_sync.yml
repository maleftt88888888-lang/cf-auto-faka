name: 🔄 自动定时抓取同步卡密到 Cloudflare

on:
  schedule:
    # 每 2 小时自动运行一次 (UTC 时间每2小时的第0分)
    - cron: '0 */2 * * *'
  workflow_dispatch: # 支持在 GitHub 网页上手动点击立即运行

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 运行自动抓取与同步
        env:
          TARGET_URL: 'https://haogd.top/share/app'
          ONLINE_FAKA_URL: 'https://cf-auto-faka.maleftt88888888.workers.dev'
          ADMIN_KEY: '51245124'
        run: |
          python scripts/auto_sync.py
