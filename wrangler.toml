name = "cf-auto-faka"
main = "src/worker.js"
compatibility_date = "2024-01-01"

# 定时触发器：每小时自动同步
[triggers]
crons = ["0 * * * *"]

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "faka-db"
database_id = "3ad9ee3f-166f-4446-9a00-b39c8fcb2ecf"

# 环境变量配置
[vars]
SITE_NAME = "小火箭账号"
ADMIN_KEY = "51245124"
PRICE_PER_ACCOUNT = "4.99"
TARGET_URL = "https://haoged.top/share/app"
