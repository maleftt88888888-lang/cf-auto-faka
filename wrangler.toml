name = "cf-auto-faka"
main = "src/worker.js"
compatibility_date = "2024-01-01"

# 定时触发器：每小时自动从目标网站抓取最新可用账号同步到库存
[triggers]
crons = ["0 * * * *"]

# D1 数据库绑定（在 Cloudflare 后台创建 D1 后绑定）
[[d1_databases]]
binding = "DB"
database_name = "faka-db"
database_id = "YOUR_D1_DATABASE_ID"

# 环境变量配置
[vars]
SITE_NAME = "云账号智能发卡平台"
ADMIN_KEY = "admin123456" # 管理员手动同步秘钥
TARGET_URL = "https://haogd.top/share/app"
PRICE_PER_ACCOUNT = "1.00" # 每个账号单价（元）

# ----------------- 汇源开放平台 / 易支付配置 -----------------
# （留空时为免支付测试出卡模式，填入后自动开启真实微信/支付宝收款）
PAY_URL = "https://汇源支付网关/submit.php"   # 汇源开放平台的支付提交网关URL
PAY_PID = ""                                 # 汇源平台的商户 ID
PAY_KEY = ""                                 # 汇源平台的商户 KEY (密钥)
