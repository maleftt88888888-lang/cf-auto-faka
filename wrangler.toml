name = "cf-auto-faka"
main = "src/worker.js"
compatibility_date = "2024-01-01"

# 定时触发器：每小时自动从目标网站抓取最新可用账号同步到库存
[triggers]
crons = ["0 * * * *"]

# D1 数据库绑定（在 Cloudflare 后台创建 D1 后填入 database_id）
[[d1_databases]]
binding = "DB"
database_name = "faka-db"
database_id = "YOUR_D1_DATABASE_ID" # 部署后在 CF 控制台获取替换

# 环境变量配置
[vars]
SITE_NAME = "云账号智能发卡平台"
ADMIN_KEY = "admin123456" # 管理员手动同步秘钥
TARGET_URL = "https://haogd.top/share/app"
PRICE_PER_ACCOUNT = "1.00" # 每个账号价格（元）
